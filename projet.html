<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projet</title>

  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #fff;
      color: #111;
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 25%;
      min-width: 180px;
      max-width: 320px;
      padding: 2rem 1.5rem;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      overflow-y: auto;
    }

    .back {
      font-size: clamp(11px, 0.75vw, 13px);
      color: #999;
      text-decoration: none;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .back:hover { color: #111; }
    .back::before { content: '←'; }

    .sidebar-title {
      font-size: clamp(12px, 0.9vw, 15px);
      font-weight: 500;
      color: #111;
      line-height: 1.4;
    }

    .sidebar-description {
      font-size: clamp(11px, 0.75vw, 13px);
      color: #999;
      line-height: 1.7;
    }

    .sidebar-about {
      margin-top: auto;
    }

    .sidebar-about a {
      font-size: clamp(11px, 0.75vw, 13px);
      color: #bbb;
      text-decoration: none;
    }

    .sidebar-about a:hover { color: #111; }

    /* MAIN CONTENT */
    .content {
      margin-left: 25%;
      flex: 1;
      border-left: 1px;
    }

    .images {
      display: flex;
      flex-direction: column;
    }

    .image-block {
      padding: 0;
    }

    .image-inner {
      display: inline-flex;
      flex-direction: column;
      max-width: 100%;
    }

    .image-block img {
      max-height: 90vh;
      max-width: 100%;
      width: auto;
      height: auto;
      display: block;
    }

    .caption {
      padding: 0.6rem 0 1.2rem 0;
      font-size: clamp(10px, 0.7vw, 12px);
      color: #bbb;
      letter-spacing: 0.04em;
    }

    .loading {
      padding: 4rem 2rem;
      font-size: clamp(11px, 0.75vw, 13px);
      color: #bbb;
    }

    /* MOBILE */
    @media (max-width: 680px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        position: relative;
        width: 100%;
        min-width: unset;
        max-width: unset;
        height: auto;
        padding: 1.5rem;
        border-bottom: 1px solid #eee;
        gap: 0.75rem;
      }

      .sidebar-description,
      .sidebar-about {
        display: none;
      }

      .content {
        margin-left: 0;
        border-left: none;
      }
      .caption {
  padding-left: 1rem;
      }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <a href="index.html" class="back">Back</a>
    <div class="sidebar-title" id="titre"></div>
    <div class="sidebar-description" id="description"></div>
    <div class="sidebar-about">
      <a href="about.html">About</a>
    </div>
  </aside>

  <main class="content">
    <div class="images" id="images">
      <div class="loading">Chargement…</div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const projet = params.get('p');

    if (!projet) {
      window.location.href = 'index.html';
    }

    const titre = projet.replace(/-/g, ' ');
    document.title = titre;
    document.getElementById('titre').textContent = titre;

    // Texte descriptif par projet — à remplir manuellement
    const descriptions = {
      // "projet-paris": "Un texte descriptif pour ce projet.",
    };
    const desc = descriptions[projet];
    if (desc) {
      document.getElementById('description').textContent = desc;
    }

    function formatCaption(name) {
      return name
        .replace(/-/g, ' ')
        .replace(/_([^_]+)_/g, '<em>$1</em>');
    }

    fetch('images.json')
      .then(r => r.json())
      .then(data => {
        const images = data[projet];
        const container = document.getElementById('images');
        container.innerHTML = '';

        if (!images || images.length === 0) {
          container.innerHTML = '<div class="loading">Aucune image pour ce projet.</div>';
          return;
        }

        images.forEach(name => {
          const block = document.createElement('div');
          block.className = 'image-block';

          const captionPlain = name.replace(/-/g, ' ').replace(/_/g, ' ');
          const captionHtml = formatCaption(name);

          block.innerHTML = `
            <div class="image-inner">
              <img
                src="images/${projet}/${name}.jpg"
                alt="${captionPlain}"
                loading="lazy"
              >
              <div class="caption">${captionHtml}</div>
            </div>
          `;

          container.appendChild(block);
        });
      })
      .catch(() => {
        document.getElementById('images').innerHTML =
          '<div class="loading">Impossible de charger les images.</div>';
      });
  </script>

</body>
</html>
