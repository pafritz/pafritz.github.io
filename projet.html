<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #fff;
      color: #111;
    }

    nav {
      padding: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back {
      font-size: 13px;
      color: #999;
      text-decoration: none;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back:hover {
      color: #111;
    }

    .back::before {
      content: '←';
    }

    nav a.about {
      font-size: 13px;
      color: #999;
      text-decoration: none;
      letter-spacing: 0.03em;
    }

    nav a.about:hover {
      color: #111;
    }

    h1 {
      padding: 0 2rem 2.5rem;
      font-size: 13px;
      font-weight: 400;
      color: #999;
      letter-spacing: 0.04em;
    }

    .images {
      display: flex;
      flex-direction: column;
      gap: 5px;
      
    }

    .image-block {
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .image-block img {
      width: 100%;
      display: block;
      max-height: 90vh;
      object-fit: contain;
      background: #fff;
    }

    .caption {
      padding: 0.75rem 2rem;
      font-size: 11px;
      color: #bbb;
      letter-spacing: 0.05em;
    }

    footer {
      padding: 3rem 2rem;
      text-align: center;
      font-size: 12px;
      color: #ccc;
    }

    .loading {
      padding: 4rem 2rem;
      text-align: center;
      font-size: 13px;
      color: #bbb;
    }

    @media (max-width: 600px) {
      nav {
        padding: 1.5rem;
      }

      h1 {
        padding: 0 1.5rem 2rem;
      }

      .caption {
        padding: 0.6rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="back">Tous les projets</a>
    <a href="about.html" class="about">About</a>
  </nav>

  <h1 id="titre"></h1>

  <main class="images" id="images">
    <div class="loading">Chargement…</div>
  </main>

  <footer>
    <a href="index.html" style="color: #ccc; text-decoration: none;">← Retour</a>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const projet = params.get('p');

    if (!projet) {
      window.location.href = 'index.html';
    }

    document.title = projet.replace(/-/g, ' ');
    document.getElementById('titre').textContent = projet.replace(/-/g, ' ');

    fetch('images.json')
      .then(r => r.json())
      .then(data => {
        const images = data[projet];
        const container = document.getElementById('images');
        container.innerHTML = '';

        if (!images || images.length === 0) {
          container.innerHTML = '<div class="loading">Aucune image pour ce projet.</div>';
          return;
        }

        function formatCaption(name) {
          return name
            .replace(/-/g, ' ')
            .replace(/_([^_]+)_/g, '<em>$1</em>');
        }

        images.forEach(name => {
          const block = document.createElement('div');
          block.className = 'image-block';

          const captionPlain = name.replace(/-/g, ' ').replace(/_/g, ' ');
          const captionHtml = formatCaption(name);

          block.innerHTML = `
            <img 
              src="images/${projet}/${name}.jpg" 
              alt="${captionPlain}"
              loading="lazy"
            >
            <div class="caption">${captionHtml}</div>
          `;

          container.appendChild(block);
        });
      })
      .catch(() => {
        document.getElementById('images').innerHTML =
          '<div class="loading">Impossible de charger les images.</div>';
      });
  </script>

</body>
</html>
