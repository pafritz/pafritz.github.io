<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projets — Paul Fritz</title>

  <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #fff;
      color: #111;
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 25%;
      min-width: 180px;
      max-width: 320px;
      padding: 2rem 1.5rem;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .back {
      font-size: clamp(11px, 0.75vw, 13px);
      color: #999;
      text-decoration: none;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .back:hover { color: #111; }
    .back::before { content: '←'; }

    .sidebar-about {
      margin-top: auto;
    }

    .sidebar-about a {
      font-size: clamp(11px, 0.75vw, 13px);
      color: #bbb;
      text-decoration: none;
    }

    .sidebar-about a:hover { color: #111; }

    /* MAIN CONTENT */
    .content {
      margin-left: 25%;
      flex: 1;
      border-left: 1px solid #eee;
      padding: 2rem 2.5rem;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .project-list a {
      font-size: clamp(12px, 0.9vw, 15px);
      color: #111;
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .project-list a:hover {
      color: #999;
    }

    .loading {
      font-size: clamp(11px, 0.75vw, 13px);
      color: #bbb;
    }

    /* MOBILE */
    @media (max-width: 680px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        position: relative;
        width: 100%;
        min-width: unset;
        max-width: unset;
        height: auto;
        padding: 1.5rem;
        border-bottom: 1px solid #eee;
        flex-direction: row;
        align-items: center;
        gap: 0;
      }

      .sidebar-about {
        margin-top: 0;
        margin-left: auto;
      }

      .content {
        margin-left: 0;
        border-left: none;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <a href="index.html" class="back">Accueil</a>
    <div class="sidebar-about">
      <a href="about.html">About</a>
    </div>
  </aside>

  <main class="content">
    <div class="project-list" id="list">
      <div class="loading">Chargement…</div>
    </div>
  </main>

  <script>
    function parseProjectName(folder) {
      const parts = folder.split('-');
      if (parts.length >= 3 && parts[0].match(/^\d{4}$/) && parts[1].match(/^\d{2}$/)) {
        const year = parts[0];
        const name = parts.slice(2).join(' ');
        return `${name} (${year})`;
      }
      return folder.replace(/-/g, ' ');
    }

    fetch('images.json')
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById('list');
        list.innerHTML = '';

        const sorted = Object.entries(data).sort((a, b) => b[0].localeCompare(a[0]));

        sorted.forEach(([projet]) => {
          const a = document.createElement('a');
          a.href = `projet.html?p=${projet}`;
          a.textContent = parseProjectName(projet);
          list.appendChild(a);
        });
      })
      .catch(() => {
        document.getElementById('list').innerHTML =
          '<div class="loading">Impossible de charger les projets.</div>';
      });
  </script>

</body>
</html>
