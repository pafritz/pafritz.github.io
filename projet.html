<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paul Fritz — Projet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-name" onclick="window.location.href='index.html'">Paul Fritz</div>
      <nav class="sidebar-nav">
        <a href="#" id="nav-projets" onclick="toggleProjectList(event)">Projets</a>
        <div class="project-list" id="project-list"></div>
      </nav>
    </div>
    <div class="sidebar-bottom">
      <a href="about.html">About</a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main-project">
    <!-- Généré par JS -->
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox-overlay" id="lightbox">
    <div class="lightbox-bg"></div>
    <div class="lightbox-img-wrap">
      <img id="lightbox-img" src="" alt="">
    </div>
  </div>

  <script src="utils.js"></script>
  <script>
    let projectListVisible = false;

    function toggleProjectList(e) {
      e.preventDefault();
      projectListVisible = !projectListVisible;
      const list = document.getElementById('project-list');
      const link = document.getElementById('nav-projets');
      list.classList.toggle('visible', projectListVisible);
      link.classList.toggle('active', projectListVisible);
    }

    // Lightbox
    const lightboxOverlay = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    function openLightbox(src) {
      lightboxImg.src = src;
      lightboxOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightboxOverlay.classList.remove('active');
      setTimeout(() => {
        lightboxImg.src = '';
        document.body.style.overflow = '';
      }, 350);
    }

    lightboxOverlay.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });

    async function init() {
      const data = await loadData();
      const sorted = sortProjects(data.projects, data.pinned || []);

      // Get current project from URL
      const params = new URLSearchParams(window.location.search);
      const currentFolder = params.get('p');

      if (!currentFolder || !data.projects[currentFolder]) {
        document.getElementById('main-project').innerHTML = '<p style="color:#888">Projet introuvable.</p>';
        return;
      }

      const { name, year } = parseProjectFolder(currentFolder);
      document.title = `Paul Fritz — ${name}`;

      const main = document.getElementById('main-project');
      const projectList = document.getElementById('project-list');

      // Populate sidebar project list
      sorted.forEach(folder => {
        const { name: n, year: y } = parseProjectFolder(folder);
        const listItem = document.createElement('a');
        listItem.className = 'project-list-item';
        listItem.href = `projet.html?p=${encodeURIComponent(folder)}`;
        listItem.textContent = `${n} (${y})`;
        if (folder === currentFolder) listItem.style.color = '#111';
        projectList.appendChild(listItem);
      });

      // Header
      const header = document.createElement('div');
      header.className = 'project-page-header';

      const backBtn = document.createElement('span');
      backBtn.className = 'back-btn';
      backBtn.textContent = '← Back';
      backBtn.addEventListener('click', () => window.history.back());

      const titleEl = document.createElement('span');
      titleEl.className = 'project-page-title';
      titleEl.textContent = `${name} (${year})`;

      header.appendChild(backBtn);
      header.appendChild(titleEl);
      main.appendChild(header);

      // Image flux
      const flux = document.createElement('div');
      flux.className = 'project-flux';

      const images = data.projects[currentFolder];

      images.forEach(imgName => {
        const item = document.createElement('div');
        item.className = 'project-flux-item';

        const img = document.createElement('img');
        img.src = `images/${currentFolder}/${imgName}.jpg`;
        img.alt = parseCaption(imgName).replace(/<[^>]+>/g, '');
        img.loading = 'lazy';

        img.onload = () => checkImageRatio(img, item);

        img.addEventListener('click', () => openLightbox(img.src));

        const caption = document.createElement('div');
        caption.className = 'flux-caption';
        caption.innerHTML = parseCaption(imgName);

        item.appendChild(img);
        item.appendChild(caption);
        flux.appendChild(item);
      });

      main.appendChild(flux);

      // See also — random other project
      const otherProjects = sorted.filter(f => f !== currentFolder);
      if (otherProjects.length > 0) {
        const randomFolder = otherProjects[Math.floor(Math.random() * otherProjects.length)];
        const { name: rName, year: rYear } = parseProjectFolder(randomFolder);
        const randomImages = data.projects[randomFolder];

        const seeAlso = document.createElement('div');
        seeAlso.className = 'see-also-section';

        const label = document.createElement('div');
        label.className = 'see-also-label';

        // Arrow gif placeholder (à remplacer par ton gif)
        const arrow = document.createElement('span');
        arrow.className = 'see-also-gif';
        arrow.textContent = '→';
        arrow.style.cssText = 'font-size:14px; color:#888;';

        const labelText = document.createElement('span');
        labelText.textContent = 'voir aussi';

        label.appendChild(arrow);
        label.appendChild(labelText);

        const seeAlsoTitle = document.createElement('div');
        seeAlsoTitle.className = 'see-also-project-name';
        seeAlsoTitle.textContent = `${rName} (${rYear})`;
        seeAlsoTitle.addEventListener('click', () => {
          window.location.href = `projet.html?p=${encodeURIComponent(randomFolder)}`;
        });

        const seeAlsoCarousel = buildCarousel(randomImages, randomFolder, true, 'see-also');

        seeAlso.appendChild(label);
        seeAlso.appendChild(seeAlsoTitle);
        seeAlso.appendChild(seeAlsoCarousel);
        main.appendChild(seeAlso);
      }
    }

    init();
  </script>
</body>
</html>
