name: Generate favicon config

on:
  push:
    paths:
      - 'favicon/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate favicon/config.json
        run: |
          python3 << 'PYTHON'
          import os, json

          favicon_dir = 'favicon'

          # Load existing config to preserve weights
          existing = {}
          config_path = os.path.join(favicon_dir, 'config.json')
          if os.path.exists(config_path):
            with open(config_path, 'r') as f:
              try:
                data = json.load(f)
                for item in data.get('favicons', []):
                  existing[str(item['id'])] = item['weight']
              except:
                pass

          # Scan for favicon folders (numeric folders only)
          favicons = []
          for entry in sorted(os.listdir(favicon_dir)):
            path = os.path.join(favicon_dir, entry)
            if os.path.isdir(path) and entry.isdigit():
              weight = existing.get(entry, 10)  # default weight 10
              favicons.append({ "id": entry, "weight": weight })

          result = { "favicons": favicons }

          with open(config_path, 'w') as f:
            json.dump(result, f, indent=2)

          print("favicon/config.json generated:")
          print(json.dumps(result, indent=2))
          PYTHON

      - name: Commit config.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add favicon/config.json
          git diff --cached --quiet || git commit -m "Update favicon config"
          git push
